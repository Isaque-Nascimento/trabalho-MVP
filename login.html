<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./stylelogin.css">
  <title>Login | Terê Verde</title>
</head>
<body>
  <main class="container">
    <form id="form-login">
      <h1>Login Terê Verde</h1>
      <div class="input-box">
        <input id="usuario" placeholder="E-mail do administrador" type="email" autocomplete="username" required>
        <i class="bx bxs-user"></i>
      </div>
      <div class="input-box">
        <input id="senha" placeholder="Senha" type="password" autocomplete="current-password" required>
        <i class="bx bxs-lock-alt"></i>
      </div>
      <p id="login-erro" role="alert" style="color:#b3261e"></p>
      <button type="submit" class="login">Entrar</button>
      <div class="register-link"><a href="./home.html">Voltar ao site</a></div>
    </form>
  </main>
  <script src="./login.js"></script>
</body>
</html>
</html>
